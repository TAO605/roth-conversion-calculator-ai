name: SEO Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: seo-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-seo-smoke:
    name: Production SEO smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEO_SMOKE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      GSC_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      SEARCH_CONSOLE_VERIFICATION_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      SEARCH_CONSOLE_VERIFICATION_DOMAIN: roth-conversion-calculator-ai.shop
      SEARCH_CONSOLE_VERIFICATION_TOKEN: bGl0K-Jm1Fck2gNqxkHlFPNWJjZDIGG5SeRvrmp1d4Q
      DNS_EVIDENCE_APEX_HOST: roth-conversion-calculator-ai.shop
      DNS_EVIDENCE_WWW_HOST: www.roth-conversion-calculator-ai.shop
      DNS_EVIDENCE_CANONICAL_URL: https://www.roth-conversion-calculator-ai.shop/
      SECURITY_HEADERS_EVIDENCE_URL: https://www.roth-conversion-calculator-ai.shop/
      HEALTH_EVIDENCE_URL: https://www.roth-conversion-calculator-ai.shop/api/health
      CRAWL_DISCOVERY_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      INTERNAL_LINK_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      HTML_QUALITY_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      PROFESSIONAL_REVIEW_PACKET_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      PERFORMANCE_EVIDENCE_URL: https://www.roth-conversion-calculator-ai.shop
      STRUCTURED_DATA_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      BLOG_DISCOVERY_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for production alias after push
        if: github.event_name == 'push'
        run: sleep 90

      - name: Run SEO smoke check
        run: |
          set -o pipefail
          node scripts/seo-smoke.mjs | tee seo-smoke-result.json

      - name: Run GSC priority URL evidence check
        run: |
          set -o pipefail
          node scripts/gsc-evidence.mjs | tee gsc-evidence-result.json

      - name: Run GSC discovered sample URL evidence check
        run: |
          set -o pipefail
          node scripts/gsc-discovered-sample-evidence.mjs | tee gsc-discovered-sample-evidence-result.json

      - name: Run Search Console verification evidence check
        run: |
          set -o pipefail
          node scripts/search-console-verification-evidence.mjs | tee search-console-verification-evidence-result.json

      - name: Run DNS and canonical host evidence check
        run: |
          set -o pipefail
          node scripts/dns-evidence.mjs | tee dns-evidence-result.json

      - name: Run security headers evidence check
        run: |
          set -o pipefail
          node scripts/security-headers-evidence.mjs | tee security-headers-evidence-result.json

      - name: Run health endpoint evidence check
        run: |
          set -o pipefail
          node scripts/health-evidence.mjs | tee health-evidence-result.json

      - name: Run crawl discovery evidence check
        run: |
          set -o pipefail
          node scripts/crawl-discovery-evidence.mjs | tee crawl-discovery-evidence-result.json

      - name: Run internal link evidence check
        run: |
          set -o pipefail
          node scripts/internal-link-evidence.mjs | tee internal-link-evidence-result.json

      - name: Run HTML quality evidence check
        run: |
          set -o pipefail
          node scripts/html-quality-evidence.mjs | tee html-quality-evidence-result.json

      - name: Run professional review packet evidence check
        run: |
          set -o pipefail
          node scripts/professional-review-packet-evidence.mjs | tee professional-review-packet-evidence-result.json

      - name: Run mobile performance evidence check
        run: |
          set -o pipefail
          node scripts/performance-evidence.mjs | tee performance-evidence-result.json

      - name: Run structured data evidence check
        run: |
          set -o pipefail
          node scripts/structured-data-evidence.mjs | tee structured-data-evidence-result.json

      - name: Run blog discovery evidence check
        run: |
          set -o pipefail
          node scripts/blog-discovery-evidence.mjs | tee blog-discovery-evidence-result.json

      - name: Run professional UI source guard evidence check
        run: |
          set -o pipefail
          node scripts/professional-ui-evidence.mjs | tee professional-ui-evidence-result.json

      - name: Validate SEO evidence artifact
        run: |
          set -o pipefail
          node scripts/validate-seo-evidence.mjs | tee seo-evidence-validation-result.json

      - name: Generate SEO evidence manifest
        run: |
          set -o pipefail
          node scripts/generate-seo-evidence-manifest.mjs | tee seo-evidence-manifest.json

      - name: Validate SEO evidence manifest checksums
        run: |
          set -o pipefail
          node scripts/validate-seo-evidence-manifest.mjs | tee seo-evidence-manifest-validation-result.json

      - name: Upload SEO evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-seo-evidence
          path: |
            seo-smoke-result.json
            gsc-evidence-result.json
            gsc-discovered-sample-evidence-result.json
            search-console-verification-evidence-result.json
            dns-evidence-result.json
            security-headers-evidence-result.json
            health-evidence-result.json
            crawl-discovery-evidence-result.json
            internal-link-evidence-result.json
            html-quality-evidence-result.json
            professional-review-packet-evidence-result.json
            performance-evidence-result.json
            structured-data-evidence-result.json
            blog-discovery-evidence-result.json
            professional-ui-evidence-result.json
            seo-evidence-validation-result.json
            seo-evidence-manifest.json
            seo-evidence-manifest-validation-result.json
          retention-days: 30
