name: SEO Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: seo-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-seo-smoke:
    name: Production SEO smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEO_SMOKE_BASE_URL: https://www.roth-conversion-calculator-ai.shop
      GSC_EVIDENCE_BASE_URL: https://www.roth-conversion-calculator-ai.shop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for production alias after push
        if: github.event_name == 'push'
        run: sleep 90

      - name: Run SEO smoke check
        run: node scripts/seo-smoke.mjs | tee seo-smoke-result.json

      - name: Run GSC priority URL evidence check
        run: node scripts/gsc-evidence.mjs | tee gsc-evidence-result.json

      - name: Validate SEO evidence artifact
        run: node scripts/validate-seo-evidence.mjs | tee seo-evidence-validation-result.json

      - name: Upload SEO evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-seo-evidence
          path: |
            seo-smoke-result.json
            gsc-evidence-result.json
            seo-evidence-validation-result.json
          retention-days: 30
